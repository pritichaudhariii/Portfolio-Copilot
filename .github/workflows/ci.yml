name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build MCP server image
        run: docker build -f packages/mcp-server/Dockerfile -t portfolio-mcp .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t portfolio-web .
